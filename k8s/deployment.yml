apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deployment
  labels:
    app: flask
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
      - name: flask-cont
        image: docker.io/library/flask-build:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
