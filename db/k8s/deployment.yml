apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deployment-db
  labels:
    app: flask-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-db
  template:
    metadata:
      labels:
        app: flask-db
    spec:
      containers:
      - name: flask-db
        image: docker.io/library/db:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
